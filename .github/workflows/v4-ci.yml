name: Trader Agent V5.3 CI

on:
  push:
    branches: [main, codex/v5]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax
        run: |
          python -m compileall -q .

      - name: Import smoke test
        run: |
          python - <<'PY'
          import futures_lab
          import futures_market
          import binance_readonly
          import engine
          import auto_decision_v5
          import monitor_v5
          import monitor_v51
          import dashboard_v51
          import publish_market_v51
          import realtime_v52
          import service_v52
          import supervisor_v53
          print("Trader Agent V5.3 imports OK")
          PY

      - name: Risk, statistics, delivery and capital editor regression tests
        run: python -m unittest discover -s tests -v
