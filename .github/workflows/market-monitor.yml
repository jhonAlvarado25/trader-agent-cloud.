name: Trader Agent V3 Monitor

on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Forzar alerta de prueba en iPhone"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "10 */4 * * *"

permissions:
  contents: read

concurrency:
  group: trader-agent-v3-monitor
  cancel-in-progress: false

jobs:
  scan-market:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restaurar historial de alertas
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: trader-alert-state-${{ github.run_id }}
          restore-keys: |
            trader-alert-state-

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Analizar BTC ETH SOL y BNB
        run: python monitor.py

      - name: Guardar historial de alertas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: trader-alert-state-${{ github.run_id }}

      - name: Publicar resumen
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("new_signals.json")
          signals = json.loads(path.read_text(encoding="utf-8")) if path.exists() else []

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("# Trader Agent V3\n\n")
              if not signals:
                  f.write("Sin nuevas señales para revisar.\n")
              else:
                  f.write(f"Nuevas señales: **{len(signals)}**\n\n")
                  for s in signals:
                      f.write(f"## {s['symbol']} — {s['state']}\n")
                      f.write(f"- Setup: {s['setup']}\n")
                      f.write(f"- Precio: {s['live_price']:.2f} USDT\n")
                      f.write(f"- Probabilidad ajustada OOS: {s['adjusted_probability']*100:.1f}%\n")
                      f.write(f"- Break-even: {s['breakeven_probability']*100:.1f}%\n")
                      f.write(f"- Edge: {s['edge_pp']:+.1f} pp\n")
                      f.write(f"- Expectativa: {s['expectancy_r']:+.2f}R\n")
                      if s.get("entry") is not None:
                          f.write(f"- Entrada ref.: {s['entry']:.2f}\n")
                          f.write(f"- Stop: {s['stop']:.2f}\n")
                          f.write(f"- Take Profit: {s['take_profit']:.2f}\n")
                      f.write("\n")
          PY

      - name: Activar notificación si hay señal nueva
        env:
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          if os.getenv("TEST_ALERT", "").lower() == "true":
              print("::error title=Trader Agent V3 - PRUEBA::Alerta de prueba para validar notificaciones en iPhone")
              raise SystemExit(1)

          path = Path("new_signals.json")
          signals = json.loads(path.read_text(encoding="utf-8")) if path.exists() else []

          if not signals:
              print("Sin nuevas señales.")
              raise SystemExit(0)

          for s in signals:
              print(
                  f"::error title=Trader Agent V3 - {s['symbol']}::{s['state']} | "
                  f"{s['setup']} | expectativa {s['expectancy_r']:+.2f}R | "
                  f"edge {s['edge_pp']:+.1f} pp"
              )

          print("Se detectó al menos una nueva oportunidad para revisión manual.")
          raise SystemExit(1)
          PY
