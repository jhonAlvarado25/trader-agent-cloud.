name: Trader Agent V5.3 Resilient Market

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitor_v51.py'
      - 'supervisor_v53.py'
      - 'market.py'
      - 'market_v5.py'
      - 'auto_decision_v5.py'
      - 'dashboard_v51.py'
      - 'publish_market_v51.py'
      - 'fx_v51.py'
      - '.github/workflows/auto-recommend-v4.yml'
  schedule:
    # One hourly start is more reliable than asking GitHub to create 12 jobs/hour.
    # Once started, the supervisor performs target 5-minute cycles inside the job.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: trader-agent-v53-supervisor
  cancel-in-progress: false

jobs:
  resilient-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore state and historical cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .state/v5_state.json
            .state/v5_market
          key: trader-v53-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trader-v53-state-
            trader-v5-state-

      - name: Dependencies
        run: python -m pip install -r requirements.txt

      - name: Resilient market supervision
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          V51_PUBLISH_TOKEN: ${{ github.token }}
          TRADER_SUPERVISOR_ROUNDS: ${{ github.event_name == 'schedule' && '11' || '1' }}
        run: python supervisor_v53.py

      - name: Persist acknowledged state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .state/v5_state.json
            .state/v5_market
          key: trader-v53-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Export shadow audit checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v53-shadow-audit-${{ github.run_id }}
          path: .state/v5_state.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
