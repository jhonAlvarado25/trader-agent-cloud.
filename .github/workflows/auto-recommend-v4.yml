name: Trader Agent V5 Unified Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: trader-agent-v4-auto
  cancel-in-progress: false

jobs:
  monitor-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRADER_CAPITAL_COP: ${{ vars.TRADER_CAPITAL_COP }}
      TRADER_AVAILABLE_COP: ${{ vars.TRADER_AVAILABLE_COP }}
      TRADER_RISK_PCT: ${{ vars.TRADER_RISK_PCT }}
      TRADER_COP_PER_USDT: ${{ vars.TRADER_COP_PER_USDT }}
      TRADER_COMMITTED_RISK_COP: ${{ vars.TRADER_COMMITTED_RISK_COP }}
      TRADER_FX_CONFIRMED: ${{ vars.TRADER_FX_CONFIRMED }}
      TRADER_MODE: ${{ vars.TRADER_MODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore V5 state and native historical cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .state/v5_state.json
            .state/v5_market
          key: trader-v5-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trader-v5-state-
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Read-only V5 monitor and acknowledged Telegram delivery
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_v5.py
      - name: Persist acknowledged state (also after errors)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .state/v5_state.json
            .state/v5_market
          key: trader-v5-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Export shadow audit checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-shadow-audit-${{ github.run_id }}
          path: .state/v5_state.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
